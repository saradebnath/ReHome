<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReHome</title>
</head>
<body>
    <h1>ReHome - Give it away, don't throw it away.</h1>
    <input type="text" id="itemInput" placeholder="Enter your item...">
    <button id="addButton">Add Item</button>
    <form id="itemForm">
        <p>What condition is your item?</p>
        <input type="radio" name="condition" value="Broken" checked> Broken <br>
        <input type="radio" name="condition" value="Fair"> Fair <br>
        <input type="radio" name="condition" value="Working"> Working <br>
    </form>
    <button onclick="checkCondition()">Check Condition</button>
    <script src="app.js"></script>
</body>
</html>
